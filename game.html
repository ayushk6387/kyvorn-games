<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Quest - Boss Fight</title>
<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b12;
  color: #eee6d5;
  font-family: Arial;
  text-align: center;
}

h1 {
  color: #d8b56d;
  letter-spacing: 4px;
  text-shadow: 0 0 8px #d8b56d, 0 0 20px #a16af2, 0 0 35px #a16af255;
  animation: titleGlow 2.5s ease-in-out infinite alternate;
  margin: 15px 0 5px;
}

p {
  color: #aaa9b9;
}

@keyframes titleGlow {
  from {
    text-shadow: 0 0 8px #d8b56d;
  }
  to {
    text-shadow: 0 0 15px #d8b56d, 0 0 30px #a16af2;
  }
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  margin: 12px auto;
  border: 2px solid #a16af2;
  background: #101724;
  touch-action: none;
  border-radius: 10px;
  box-shadow: 0 0 15px #a16af255, 0 0 35px #a16af222;
}

button {
  background: #282333;
  color: #f3dba0;
  border: 1px solid #9b7945;
  border-radius: 8px;
  padding: 11px 14px;
  margin: 4px;
  font-weight: bold;
  cursor: pointer;
  transition: all .25s ease;
}

button:hover {
  background: #7650a8;
  color: white;
  border-color: #d8b56d;
  box-shadow: 0 0 15px #a16af288;
  transform: translateY(-2px);
}

.controls-info {
  max-width: 900px;
  margin: 16px auto 24px;
  padding: 14px 18px;
  color: #d7c9e8;
  background: #151525;
  border: 1px solid #7652a8;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.8;
}

.home-btn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 9999;
  background: #171329;
  color: #d8b56d;
  border: 1px solid #a16af2;
  padding: 10px 18px;
  border-radius: 8px;
  box-shadow: 0 0 15px #a16af255;
}

.game-subtitle {
  color: #b99be8;
  font-size: 13px;
  letter-spacing: 3px;
  font-weight: bold;
  margin: 8px 0 18px;
  text-shadow: 0 0 12px #a16af2;
}

#restart {
  background: linear-gradient(135deg, #7650a8, #3b245e);
  color: #ffffff;
  border: 2px solid #d8b56d;
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #a16af255;
}

#restart:hover {
  background: linear-gradient(135deg, #a16af2, #7650a8);
  box-shadow: 0 0 25px #a16af2;
  transform: scale(1.05);
}

#gameArea {
  position: relative;
  width: min(96vw, 960px);
  margin: 12px auto;
}

#gameArea canvas {
  width: 100%;
  display: block;
}

#mobileControls {
  position: absolute;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: space-between;
  padding: 20px 5px 20px 8px;
  pointer-events: none;
}

#joyBase {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #ffffff20;
  border: 3px solid #ffffff99;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  touch-action: none;
}

#joyKnob {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #a16af2cc;
  border: 2px solid white;
  box-shadow: 0 0 12px #a16af2;
}

#mobileActions {
  display: flex;
  gap: 12px;
  pointer-events: auto;
}

#mobileActions button {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #a16af2;
  color: white;
  border: 2px solid white;
  font-size: 24px;
  touch-action: none;
}
#mobileAttack {
  background: #e53935 !important;
  box-shadow: 0 0 12px #e5393580;
}
@media (max-width: 600px) {
  canvas {
    width: 100%;
    height: auto;
    border-radius: 5px;
  }

  button {
    padding: 10px 14px;
    font-size: 13px;
    margin: 4px;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 2px;
  }

  .controls-info {
    font-size: 12px;
    padding: 10px;
    margin: 10px;
  }

  #mobileControls {
    display: flex;
  }
}

/* MOBILE LANDSCAPE FIX */
@media screen and (max-width: 900px) and (orientation: landscape) {

  body {
    overflow: hidden;
  }

  h1,
  .game-subtitle,
  body > p:not(#status),
  .controls-info {
    display: none;
  }

  #gameArea {
    width: 100vw;
    height: 100dvh;
    margin: 0;
  }

  #gameArea canvas {
    width: 100%;
    height: 100%;
    object-fit: fill;
    margin: 0;
    border-radius: 0;
  }

  #mobileControls {
    display: flex !important;
    padding: 12px 5px 12px 8px;
    align-items: flex-end;
  }

  #joyBase {
    width: 85px;
    height: 85px;
  }

  #joyKnob {
    width: 38px;
    height: 38px;
  }

  #mobileActions button {
    width: 58px;
    height: 58px;
  }

  #pauseBtn,
  #fullscreenBtn {
    position: fixed;
    top: 8px;
    z-index: 10000;
  }

  #pauseBtn {
    right: 125px;
  }

  #fullscreenBtn {
    right: 8px;
  }

  .home-btn {
    top: 8px;
    left: 8px;
  }

  #status {
    display: none;
  }
}

</style>
</head>
<body>
<h1>JUNGLE QUEST</h1>
<p class="game-subtitle">ENTER THE WILD • SURVIVE THE DARKNESS • DEFEAT THE BOSS</p>
<p>Dark Fantasy • Boss Fight Edition</p>
<div id="gameArea">
  <canvas id="game" width="960" height="480"></canvas>

  <div id="mobileControls">
    <div id="joyBase">
      <div id="joyKnob"></div>
    </div>

    <div id="mobileActions">
      <button id="mobileJump">⬆</button>
      <button id="mobileAttack">⚔</button>
    </div>
  </div>
</div>
<button id="pauseBtn" onclick="togglePause()">⏸ PAUSE</button>
<button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
<button class="home-btn" onclick="window.location.href='index.html'">
    ← HOME
</button>
<p id="status">Defeat the monsters and face the ancient boss!</p>
<div>
<button id="left">◀ Left</button>
<button id="right">Right ▶</button>
<button id="jump">⬆ Jump</button>
<button id="attack">⚔ Attack</button>
<button id="interact">E — Interact</button>
<button id="restart">↻ Restart</button>
</div>
<p class="controls-info">
  ⌨️ A / D or ← / → : Move |
  SPACE / W / ↑ : Jump |
  J : Attack |
  E : Interact |
  🖱️ Mouse : Select Level / Toggle Sound
</p>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const W=960,H=480;
let WORLD=2700;
const keys={};
const held={left:false,right:false};

let state="menu",cameraX=0,score=0,frame=0;
let isPaused = false;
function togglePause(){
  if(state !== "playing") return;

  isPaused = !isPaused;

  const btn = document.getElementById("pauseBtn");

  if(isPaused){
    btn.innerHTML = "▶ RESUME";
  }else{
    btn.innerHTML = "⏸ PAUSE";
  }
}
let currentLevel=1;
let unlockedLevel=1;
const levels = [
  {name:"Dark Jungle", worldWidth:2700},
  {name:"Crystal Cave", worldWidth:2700},
  {name:"Frozen Kingdom", worldWidth:2700},
  {name:"Shadow Castle", worldWidth:2700}
];
let soundEnabled=true,audioCtx=null;
let coins=[],enemies=[],boss;
let chestOpen=false,attackTimer=0,attackCooldown=0;
let message="",messageTimer=0;

const player={
 x:60,y:330,w:30,h:44,vx:0,vy:0,speed:4,
 grounded:false,health:100,facing:1,invincible:0
};

let platforms=[
 {x:0,y:420,w:500,h:60},
 {x:500,y:385,w:180,h:95},
 {x:680,y:420,w:350,h:60},
 {x:1030,y:370,w:190,h:110},
 {x:1220,y:420,w:360,h:60},
 {x:1580,y:375,w:200,h:105},
 {x:1780,y:420,w:350,h:60},
 {x:2130,y:365,w:200,h:115},
 {x:2330,y:420,w:370,h:60},
 {x:210,y:340,w:120,h:16},
 {x:390,y:285,w:120,h:16},
 {x:750,y:330,w:120,h:16},
 {x:920,y:280,w:120,h:16},
 {x:1100,y:315,w:110,h:16},
 {x:1370,y:335,w:120,h:16},
 {x:1640,y:315,w:120,h:16},
 {x:1850,y:330,w:120,h:16},
 {x:2030,y:280,w:120,h:16},
 {x:2390,y:330,w:120,h:16}
];

let coinLocations=[
 [245,300],[425,245],[555,345],[790,290],[960,240],
 [1130,275],[1400,295],[1680,275],[1885,290],
 [2070,240],[2420,290],[2530,375]
];

let chest={x:2350,y:380,w:42,h:40};
let gate={x:2610,y:340,w:38,h:80};
const originalLevel1 = {
 platforms: platforms.map(p=>({...p})),
 coinLocations: coinLocations.map(c=>[...c]),
 chest: {...chest},
 gate: {...gate}
};

const level2Map = {
 platforms: [
  {x:0,y:420,w:400,h:60},
  {x:400,y:380,w:180,h:100},
  {x:580,y:420,w:300,h:60},
  {x:880,y:350,w:180,h:130},
  {x:1060,y:420,w:300,h:60},
  {x:1360,y:370,w:200,h:110},
  {x:1560,y:420,w:350,h:60},
  {x:1910,y:350,w:180,h:130},
  {x:2090,y:420,w:610,h:60},
  {x:180,y:330,w:120,h:16},
  {x:470,y:290,w:120,h:16},
  {x:730,y:330,w:120,h:16},
  {x:990,y:270,w:120,h:16},
  {x:1240,y:320,w:120,h:16},
  {x:1480,y:290,w:120,h:16},
  {x:1740,y:330,w:120,h:16},
  {x:1990,y:280,w:120,h:16},
  {x:2250,y:330,w:120,h:16}
 ],
 coinLocations: [
  [210,290],[500,250],[750,290],[1010,230],
  [1260,280],[1500,250],[1760,290],[2010,240],
  [2270,290],[550,375],[1650,375],[2450,375]
 ],
 chest: {x:2350,y:380,w:42,h:40},
 gate: {x:2610,y:340,w:38,h:80}
};

function applyLevelMap(){

 if(currentLevel===1){
  platforms=originalLevel1.platforms.map(p=>({...p}));
  coinLocations=originalLevel1.coinLocations.map(c=>[...c]);
  chest={...originalLevel1.chest};
  gate={...originalLevel1.gate};
 }

 if(currentLevel===2){
  platforms=level2Map.platforms.map(p=>({...p}));
  coinLocations=level2Map.coinLocations.map(c=>[...c]);
  chest={...level2Map.chest};
  gate={...level2Map.gate};
 }

 WORLD=levels[currentLevel-1].worldWidth;
}
function playSound(type){
 if(!soundEnabled)return;
 try{
  audioCtx??=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const sounds={
   coin:[880,1320,.12],sword:[320,100,.16],
   hit:[180,65,.18],defeat:[240,520,.22],
   jump:[260,420,.12],chest:[330,880,.35],
   victory:[440,880,.5],boss:[100,45,.3],
   hurt:[150,70,.2]
  };
  const [a,b,d]=sounds[type]||sounds.coin;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type=type==="sword"||type==="boss"?"sawtooth":"square";
  o.frequency.setValueAtTime(a,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,b),audioCtx.currentTime+d);
  g.gain.setValueAtTime(.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.10,audioCtx.currentTime+.015);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);
  o.start();o.stop(audioCtx.currentTime+d);
 }catch(e){}
}

function resetGame(){
isPaused = false;
document.getElementById("pauseBtn").innerHTML = "⏸ PAUSE";
 player.x=60;player.y=330;player.vx=0;player.vy=0;
 player.health=100;player.facing=1;player.grounded=false;player.invincible=0;
 cameraX=0;score=0;chestOpen=false;attackTimer=0;attackCooldown=0;
 message="";messageTimer=0;frame=0;
 applyLevelMap();
 coins=coinLocations.map(c=>({x:c[0],y:c[1],got:false}));
 if(currentLevel===1){
 enemies=[
  {x:310,y:385,w:34,h:35,start:270,end:450,dir:1,hp:2,max:2,alive:true},
  {x:820,y:385,w:34,h:35,start:710,end:990,dir:-1,hp:2,max:2,alive:true},
  {x:1160,y:335,w:34,h:35,start:1050,end:1180,dir:1,hp:3,max:3,alive:true},
  {x:1690,y:340,w:34,h:35,start:1600,end:1740,dir:-1,hp:3,max:3,alive:true},
  {x:1970,y:385,w:34,h:35,start:1810,end:2100,dir:1,hp:3,max:3,alive:true}
 ];
}

if(currentLevel===2){
 enemies=[
  {x:300,y:295,w:34,h:35,start:180,end:340,dir:1,hp:2,max:2,alive:true},
  {x:750,y:385,w:34,h:35,start:620,end:830,dir:-1,hp:2,max:2,alive:true},
  {x:1200,y:385,w:34,h:35,start:1080,end:1320,dir:1,hp:3,max:3,alive:true},
  {x:1740,y:295,w:34,h:35,start:1600,end:1850,dir:-1,hp:3,max:3,alive:true},
  {x:2200,y:385,w:34,h:35,start:2120,end:2500,dir:1,hp:3,max:3,alive:true}
 ];
}
 if(currentLevel===1){
 boss={
  x:2200,y:285,w:66,h:75,hp:8,max:8,
  dir:-1,attackTimer:100,flash:0,alive:true,
  jumping:false,vy:0
 };
}

if(currentLevel===2){
 boss={
  x:2350,y:345,w:66,h:75,hp:8,max:8,
  dir:-1,attackTimer:100,flash:0,alive:true,
  jumping:false,vy:0
 };
}
 state="playing";
 statusText.textContent="Level "+currentLevel+": "+levels[currentLevel-1].name+" | Collect coins and defeat the boss!";
}

function jump(){
    if(isPaused)return;
 if(state==="playing"&&player.grounded){
  player.vy=-12;player.grounded=false;playSound("jump");
 }
}

function attack(){
    if(isPaused)return;
 if(state!=="playing"||attackCooldown>0)return;
 attackCooldown=24;attackTimer=12;playSound("sword");
 const sword={
  x:player.facing===1?player.x+player.w:player.x-48,
  y:player.y+5,w:65,h:38
 };
 for(const e of enemies){
  if(!e.alive)continue;
  if(overlap(sword,e)){
   e.hp--;playSound("hit");
   if(e.hp<=0){e.alive=false;playSound("defeat");}
  }
 }
 if(boss.alive&&overlap(sword,boss)){
  boss.hp=Math.max(0,boss.hp-1);
  boss.flash=10;
  playSound("boss");
  if(boss.hp===0){
   boss.alive=false;
   playSound("defeat");
   message="THE ANCIENT BOSS HAS FALLEN!";
   messageTimer=180;
  }
 }
}

function interact(){
    if(isPaused)return;
 if(state!=="playing")return;
 const nearChest=Math.abs(player.x+player.w/2-(chest.x+chest.w/2))<100;
 if(nearChest&&Math.abs(player.y-chest.y)<100){
  if(score===coins.length&&enemies.every(e=>!e.alive)&&!boss.alive){
   if(!chestOpen){chestOpen=true;playSound("chest");}
   message="Treasure unlocked! Reach the glowing gate.";
  }else{
   message="Defeat all monsters and the boss; collect every coin!";
  }
  messageTimer=180;return;
 }
 const nearGate=Math.abs(player.x+player.w/2-(gate.x+gate.w/2))<85;
 if(nearGate&&Math.abs(player.y-gate.y)<110){
  if(chestOpen){

  if(currentLevel<levels.length){
    currentLevel++;
    unlockedLevel=Math.max(unlockedLevel,currentLevel);

    playSound("victory");
    message="LEVEL "+currentLevel+" UNLOCKED!";
    resetGame();

  }else{
    state="won";
    statusText.textContent="Congratulations! You conquered all worlds!";
    playSound("victory");
  }

}else{message="Unlock the treasure chest first!";messageTimer=120;}
  return;
 }
 message="Nothing nearby to interact with.";messageTimer=90;
}

onkeydown=e=>{
 const k=e.key.toLowerCase();
 if([" ","arrowup","arrowleft","arrowright"].includes(k))e.preventDefault();
 if(state==="menu"&&(k==="enter"||k===" ")){resetGame();return;}
 if((state==="won"||state==="lost")&&k==="enter"){resetGame();return;}
 if(keys[k])return;
 keys[k]=true;
 if(k==="w"||k==="arrowup"||k===" ")jump();
 if(k==="j")attack();
 if(k==="e")interact();
};
onkeyup=e=>keys[e.key.toLowerCase()]=false;

function bindHold(id,prop){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();held[prop]=true;b.setPointerCapture(e.pointerId);
 });
 for(const ev of ["pointerup","pointercancel","lostpointercapture"])
  b.addEventListener(ev,()=>held[prop]=false);
}
bindHold("left","left");bindHold("right","right");
const joyBase = document.getElementById("joyBase");
const joyKnob = document.getElementById("joyKnob");

function moveJoystick(e){
  const rect = joyBase.getBoundingClientRect();
  const dx = e.clientX - (rect.left + rect.width / 2);
  const dy = e.clientY - (rect.top + rect.height / 2);

  const max = 30;
  const x = Math.max(-max, Math.min(max, dx));
  const y = Math.max(-max, Math.min(max, dy));

  joyKnob.style.transform = `translate(${x}px, ${y}px)`;

  held.left = dx < -12;
  held.right = dx > 12;
}

function resetJoystick(){
  held.left = false;
  held.right = false;
  joyKnob.style.transform = "translate(0px, 0px)";
}

joyBase.addEventListener("pointerdown", e=>{
  e.preventDefault();
  joyBase.setPointerCapture(e.pointerId);
  moveJoystick(e);
});

joyBase.addEventListener("pointermove", e=>{
  if(e.buttons) moveJoystick(e);
});

joyBase.addEventListener("pointerup", resetJoystick);
joyBase.addEventListener("pointercancel", resetJoystick);
joyBase.addEventListener("lostpointercapture", resetJoystick);

document.getElementById("mobileJump").addEventListener("pointerdown", e=>{
  e.preventDefault();
  jump();
});

document.getElementById("mobileAttack").addEventListener("pointerdown", e=>{
  e.preventDefault();
  attack();
});
document.getElementById("jump").onclick=jump;
document.getElementById("attack").onclick=attack;
document.getElementById("interact").onclick=interact;
document.getElementById("restart").onclick=resetGame;

function overlap(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function update(){
 if(state!=="playing" || isPaused)return;
 frame++;
 player.vx=0;
 if(keys.a||keys.arrowleft||held.left){player.vx=-player.speed;player.facing=-1;}
 if(keys.d||keys.arrowright||held.right){player.vx=player.speed;player.facing=1;}
 player.x=Math.max(0,Math.min(WORLD-player.w,player.x+player.vx));
 const oldY=player.y;
 player.vy=Math.min(14,player.vy+.55);
 player.y+=player.vy;player.grounded=false;

 for(const p of platforms){
  const ox=player.x+player.w>p.x&&player.x<p.x+p.w;
  const cross=oldY+player.h<=p.y&&player.y+player.h>=p.y;
  if(ox&&cross&&player.vy>=0){
   player.y=p.y-player.h;player.vy=0;player.grounded=true;
  }
 }
 if(player.y>650){
  player.health-=20;player.x=Math.max(60,player.x-120);
  player.y=300;player.vy=0;player.invincible=70;playSound("hurt");
 }
 for(const c of coins){
  if(!c.got&&overlap(player,{x:c.x-10,y:c.y-10,w:20,h:20})){
   c.got=true;score++;playSound("coin");
  }
 }
 for(const e of enemies){
  if(!e.alive)continue;
  e.x+=e.dir*1.05;
  if(e.x<e.start){e.x=e.start;e.dir=1;}
  if(e.x>e.end){e.x=e.end;e.dir=-1;}
  if(overlap(player,e)&&player.invincible<=0){
   player.health-=10;player.invincible=60;player.vy=-5;
   player.x=Math.max(0,Math.min(WORLD-player.w,player.x-e.dir*32));
   playSound("hurt");
  }
 }

 // Boss patrols and periodically attacks nearby hero.
 if(boss.alive){
  const range=boss.hp<=4;
  boss.x+=boss.dir*(range?1.5:.8);

  if(currentLevel===1){
 if(boss.x<2160){boss.x=2160;boss.dir=1;}
 if(boss.x>2290){boss.x=2290;boss.dir=-1;}
}

if(currentLevel===2){
 if(boss.x<2250){boss.x=2250;boss.dir=1;}
 if(boss.x>2450){boss.x=2450;boss.dir=-1;}
}

  if(boss.flash>0)boss.flash--;

  if(boss.attackTimer>0)boss.attackTimer--;

  // Boss special jump attack
  if(boss.attackTimer<=0){
    boss.attackTimer=boss.hp<=4?85:130;

    if(Math.abs(player.x-boss.x)<350){
      boss.flash=25;
      boss.jumping=true;
      boss.vy=boss.hp<=4?-14:-11;
    }
  }

  if(boss.jumping){
    boss.y+=boss.vy;
    boss.vy+=.5;

    if(boss.y>=285){
      boss.y=275;
      boss.jumping=false;
      boss.flash=25;

      // Landing shockwave damage
      if(Math.abs(player.x-boss.x)<120 && player.invincible<=0){
        player.health-=boss.hp<=4?25:15;
        player.invincible=75;
        player.vy=-7;
        playSound("hurt");
      }
    }
  }
}
 if(player.invincible>0)player.invincible--;
 if(attackCooldown>0)attackCooldown--;
 if(attackTimer>0)attackTimer--;
 if(messageTimer>0)messageTimer--;

 cameraX=Math.max(0,Math.min(WORLD-W,player.x-W*.38));
 if(player.health<=0){
  player.health=0;state="lost";
  statusText.textContent="The forest has defeated you. Try again!";
 }
}

 ctx.textAlign="center";
 ctx.shadowColor="#a16af2";
 ctx.shadowBlur=25;
 ctx.fillStyle="#d8b56d";
 ctx.font="bold 52px Georgia";
 ctx.fillText("JUNGLE QUEST",W/2,85);
 ctx.shadowBlur=0;

 // Subtitle
 ctx.fillStyle="#c6b7c9";
 ctx.font="bold 16px Arial";
 ctx.fillText("THE DARKNESS IS WAITING...",W/2,120);

 // Level selection heading
 ctx.fillStyle="#ffffff";
 ctx.font="bold 22px Arial";
 ctx.fillText("SELECT YOUR LEVEL",W/2,155);

 // Level cards
 for(let i=0;i<levels.length;i++){

  const x=150+(i%2)*350;
  const y=175+Math.floor(i/2)*105;

  const unlocked=i<unlockedLevel;

  ctx.fillStyle=unlocked?"#28233b":"#171820";
  ctx.fillRect(x,y,300,75);

  ctx.strokeStyle=unlocked?"#a16af2":"#55515b";
  ctx.lineWidth=2;
  ctx.strokeRect(x,y,300,75);
  ctx.shadowColor = unlocked ? "#a16af2" : "transparent";
  ctx.shadowBlur = unlocked ? 15 : 0;

  ctx.fillStyle=unlocked?"#f6dfa1":"#77727e";
  ctx.font="bold 20px Arial";

  ctx.fillText(
   unlocked?(i+1)+". "+levels[i].name:"🔒 LOCKED",
   x+150,y+44
  );
  ctx.shadowBlur = 0;
 }
// Sound button
ctx.fillStyle = soundEnabled ? "#d8b56d" : "#777777";
ctx.font = "bold 24px Arial";
ctx.textAlign = "right";
ctx.fillText(soundEnabled ? "🔊" : "🔇", W-25, 40);
 // Instructions
 ctx.fillStyle="#d8b56d";
 ctx.font="bold 16px Arial";
 ctx.fillText("CLICK AN UNLOCKED LEVEL TO BEGIN",W/2,410);

 ctx.fillStyle="#aaa9b9";
 ctx.font="14px Arial";
 ctx.fillText("A / D Move  •  SPACE Jump  •  J Attack",W/2,440);

 ctx.textAlign="left";
}


function drawEnd(){
 drawWorld();

 // Dark overlay
 ctx.fillStyle="rgba(5,7,15,0.88)";
 ctx.fillRect(0,0,W,H);

 // Main panel
 ctx.fillStyle="#171525";
 ctx.fillRect(180,95,600,310);

 ctx.strokeStyle="#a16af2";
 ctx.lineWidth=3;
 ctx.strokeRect(180,95,600,310);

 // Heading
 ctx.textAlign="center";
 ctx.fillStyle=state==="won"?"#e8c779":"#e85e6c";
 ctx.font="bold 46px Georgia";

 ctx.fillText(
  state==="won"?"VICTORY!":"GAME OVER",
  W/2,165
 );

 // Subtitle
 ctx.fillStyle="#f1e7d5";
 ctx.font="20px Arial";

 ctx.fillText(
  state==="won"?"You conquered the ancient forest!":"The forest claims another hero.",
  W/2,215
 );

 // Score
 ctx.fillStyle="#d8b56d";
 ctx.font="bold 24px Arial";
 ctx.fillText("YOUR SCORE: "+score,W/2,265);

 // Restart instruction
 ctx.fillStyle="#ffffff";
 ctx.font="17px Arial";
 ctx.fillText("Press ENTER or click RESTART below",W/2,315);

 ctx.textAlign="left";
}

canvas.addEventListener("click",e=>{
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*W/r.width;
 const y=(e.clientY-r.top)*H/r.height;

 if(x>W-65&&y<65){
  soundEnabled=!soundEnabled;
  if(soundEnabled)playSound("coin");
  return;
 }

 if(state==="menu"){

  for(let i=0;i<levels.length;i++){

   const bx=150+(i%2)*350;
   const by=175+Math.floor(i/2)*105;

   if(
    x>=bx&&x<=bx+300&&
    y>=by&&y<=by+75&&
    i<unlockedLevel
   ){
    currentLevel=i+1;
    resetGame();
    return;
   }
  }
 }
});
function updateMobileControls(){
  document.getElementById("mobileControls").style.display =
    state === "playing" ? "flex" : "none";
}
function loop(){
 if(state==="playing"){
  update();drawWorld();
 }else if(state==="menu")drawMenu();
 else drawEnd();
 updateMobileControls();
 requestAnimationFrame(loop);
}
resetGame();state="menu";loop();
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

document.addEventListener("fullscreenchange",()=>{
  const btn = document.getElementById("fullscreenBtn");

  if(document.fullscreenElement){
    btn.innerHTML = "✕ EXIT FULLSCREEN";
  }else{
    btn.innerHTML = "⛶ FULLSCREEN";
  }
});
</script>
</body>
</html>
