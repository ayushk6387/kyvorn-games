
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival | KYVORN GAMES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080b0a;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game-container {
    width: 100%;
    height: 100vh;
    position: relative;
}

#game-canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#game-title {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    letter-spacing: 4px;
    color: #e5e5e5;
    text-shadow: 0 0 15px #00ff66;
    pointer-events: none;
    z-index: 5;
}

#status {
    position: absolute;
    bottom: 25px;
    left: 25px;
    color: #b8c5bb;
    font-size: 13px;
    pointer-events: none;
    z-index: 5;
}

#camera-switch {
    position: absolute;
    top: 25px;
    right: 25px;
    min-width: 85px;
    padding: 12px 20px;
    background: rgba(15, 20, 18, 0.9);
    color: white;
    border: 1px solid #8caa96;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    z-index: 10;
    transition: 0.2s;
}

#camera-switch:hover {
    background: #263d30;
    border-color: #00ff66;
    box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
}
</style>
</head>

<body>

<div id="game-container">
    <h1 id="game-title">ZOMBIE SURVIVAL</h1>
    <div id="status">CLICK GAME TO START</div>
    <button id="camera-switch">FPP</button>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


// ==============================
// SCENE SETUP
// ==============================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x89918b);
scene.fog = new THREE.Fog(0x89918b, 15, 80);


// ==============================
// CAMERA SETUP
// ==============================

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 3, 8);


// ==============================
// RENDERER SETUP
// ==============================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.domElement.id = "game-canvas";

document.getElementById("game-container")
    .appendChild(renderer.domElement);


// ==============================
// LIGHTING
// ==============================

const light = new THREE.HemisphereLight(
    0xffffff,
    0x404040,
    2
);

scene.add(light);


// ==============================
// GROUND
// ==============================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
        color: 0x424942
    })
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;

scene.add(ground);


// ==============================
// CITY ROAD
// ==============================

const road = new THREE.Mesh(
    new THREE.PlaneGeometry(12, 200),
    new THREE.MeshStandardMaterial({
        color: 0x252927
    })
);

road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;

scene.add(road);


// ==============================
// ROAD LINES
// ==============================

const lineMaterial = new THREE.MeshBasicMaterial({
    color: 0xb9b9a0
});

for (let i = -90; i < 100; i += 12) {

    const line = new THREE.Mesh(
        new THREE.PlaneGeometry(0.18, 5),
        lineMaterial
    );

    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.03, i);

    scene.add(line);
}


// ==============================
// FOOTPATHS
// ==============================

const sidewalkMaterial = new THREE.MeshStandardMaterial({
    color: 0x77796f
});

[-7, 7].forEach(x => {

    const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(2, 0.3, 200),
        sidewalkMaterial
    );

    sidewalk.position.set(x, 0.1, 0);
    scene.add(sidewalk);

});


// ==============================
// ABANDONED BUILDINGS
// ==============================

const buildingMaterials = [
    0x55534e,
    0x494b48,
    0x66605a,
    0x3d4542
].map(color => new THREE.MeshStandardMaterial({
    color: color
}));

for (let i = 0; i < 18; i++) {

    [-1, 1].forEach(side => {

        const width = 5 + Math.random() * 5;
        const height = 7 + Math.random() * 13;
        const depth = 7 + Math.random() * 9;

        const building = new THREE.Mesh(
            new THREE.BoxGeometry(width, height, depth),
            buildingMaterials[
                Math.floor(Math.random() * buildingMaterials.length)
            ]
        );

        building.position.set(
            side * (12 + Math.random() * 4),
            height / 2,
            -i * 11 - 5
        );

        scene.add(building);

    });

}


// ==============================
// STREET LIGHTS
// ==============================

const poleMaterial = new THREE.MeshStandardMaterial({
    color: 0x292d2b
});

for (let i = 0; i < 8; i++) {

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.16, 7, 8),
        poleMaterial
    );

    pole.position.set(
        i % 2 === 0 ? -8 : 8,
        3.5,
        -i * 23
    );

    scene.add(pole);

    const lamp = new THREE.PointLight(
        0xffd69a,
        1.5,
        12
    );

    lamp.position.set(
        pole.position.x,
        7.1,
        pole.position.z
    );

    scene.add(lamp);

}


// ==============================
// PLAYER CHARACTER
// ==============================

const player = new THREE.Group();

const skinMaterial = new THREE.MeshStandardMaterial({
    color: 0xc49a78,
    roughness: 0.85
});

const jacketMaterial = new THREE.MeshStandardMaterial({
    color: 0x34483c,
    roughness: 0.9
});

const darkMaterial = new THREE.MeshStandardMaterial({
    color: 0x202724,
    roughness: 0.9
});

const pantsMaterial = new THREE.MeshStandardMaterial({
    color: 0x303936,
    roughness: 0.9
});

const bootMaterial = new THREE.MeshStandardMaterial({
    color: 0x171b19,
    roughness: 0.9
});

function addPart(geometry, material, x, y, z) {

    const part = new THREE.Mesh(geometry, material);

    part.position.set(x, y, z);

    player.add(part);

    return part;
}


// TORSO

addPart(
    new THREE.BoxGeometry(0.85, 1.05, 0.48),
    jacketMaterial,
    0, 1.55, 0
);


// SHOULDERS

addPart(
    new THREE.SphereGeometry(0.25, 16, 12),
    jacketMaterial,
    -0.48, 1.92, 0
);

addPart(
    new THREE.SphereGeometry(0.25, 16, 12),
    jacketMaterial,
    0.48, 1.92, 0
);


// NECK

addPart(
    new THREE.CylinderGeometry(0.13, 0.15, 0.2, 12),
    skinMaterial,
    0, 2.15, 0
);


// HEAD

addPart(
    new THREE.SphereGeometry(0.3, 20, 16),
    skinMaterial,
    0, 2.43, 0
);


// HAIR

const hair = addPart(
    new THREE.SphereGeometry(0.31, 16, 12),
    darkMaterial,
    0, 2.59, 0
);

hair.scale.y = 0.55;


// BACKPACK

addPart(
    new THREE.BoxGeometry(0.55, 0.75, 0.22),
    darkMaterial,
    0, 1.55, 0.34
);


// BELT

addPart(
    new THREE.BoxGeometry(0.78, 0.12, 0.5),
    darkMaterial,
    0, 1.05, 0
);


// PLAYER ARMS

const playerArms = [];

[-1, 1].forEach(side => {

    const armGroup = new THREE.Group();

    armGroup.position.set(side * 0.48, 1.95, 0);

    const upperArm = new THREE.Mesh(
        new THREE.CylinderGeometry(0.13, 0.11, 0.65, 12),
        jacketMaterial
    );

    upperArm.position.y = -0.32;
    armGroup.add(upperArm);

    const forearm = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11, 0.09, 0.35, 12),
        jacketMaterial
    );

    forearm.position.y = -0.78;
    armGroup.add(forearm);

    const hand = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 12, 10),
        skinMaterial
    );

    hand.position.y = -1.02;
    armGroup.add(hand);

    player.add(armGroup);
    playerArms.push(armGroup);

});


// PLAYER LEGS

[-1, 1].forEach(side => {

    addPart(
        new THREE.CylinderGeometry(0.17, 0.13, 0.82, 12),
        pantsMaterial,
        side * 0.22, 0.52, 0
    );

    addPart(
        new THREE.BoxGeometry(0.3, 0.18, 0.48),
        bootMaterial,
        side * 0.22, 0.1, -0.08
    );

});

player.position.set(0, 0, 3);
scene.add(player);


// ==============================
// ZOMBIE CHARACTERS
// ==============================

const zombieBodyMaterial = new THREE.MeshStandardMaterial({
    color: 0x596b50,
    roughness: 1
});

const zombieClothesMaterial = new THREE.MeshStandardMaterial({
    color: 0x292f2a,
    roughness: 1
});

const zombieEyeMaterial = new THREE.MeshStandardMaterial({
    color: 0xff3333,
    emissive: 0x990000,
    emissiveIntensity: 1.5
});

const zombies = [];

const zombieArms = [];
const zombieLegs = [];

function createZombie(x, z) {

    const zombie = new THREE.Group();

    // BODY

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.1, 0.45),
        zombieClothesMaterial
    );

    body.position.y = 1.45;
    zombie.add(body);


    // HEAD

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 12),
        zombieBodyMaterial
    );

    head.position.y = 2.25;
    zombie.add(head);


    // EYES

    [-1, 1].forEach(side => {

        const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 8, 8),
            zombieEyeMaterial
        );

        eye.position.set(
            side * 0.12,
            2.28,
            -0.26
        );

        zombie.add(eye);

    });


    // ARMS

    const arms = [];

    [-1, 1].forEach(side => {

        const armPivot = new THREE.Group();

        armPivot.position.set(
            side * 0.48,
            1.95,
            0
        );

        const arm = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.1, 0.9, 10),
            zombieBodyMaterial
        );

        arm.position.y = -0.45;

        armPivot.add(arm);
        zombie.add(armPivot);

        arms.push(armPivot);

    });


    // LEGS

    const legs = [];

    [-1, 1].forEach(side => {

        const legPivot = new THREE.Group();

        legPivot.position.set(
            side * 0.2,
            0.9,
            0
        );

        const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.12, 0.85, 10),
            zombieClothesMaterial
        );

        leg.position.y = -0.42;

        legPivot.add(leg);
        zombie.add(legPivot);

        legs.push(legPivot);

    });


    zombie.position.set(x, 0, z);

    scene.add(zombie);

    zombies.push(zombie);

    zombieArms.push(arms);
    zombieLegs.push(legs);

    return zombie;

}


// CREATE FOUR ZOMBIES

createZombie(-3, -15);
createZombie(3, -28);
createZombie(-3, -42);
createZombie(3, -55);

// ==============================
// ZOMBIE RANDOM MOVEMENT
// ==============================

const zombieMovement = zombies.map((zombie, index) => ({
    direction: Math.random() * Math.PI * 2,
    speed: 0.025 + Math.random() * 0.015,
    timer: 60 + Math.random() * 120,
    phase: index * 1.5
}));

// ==============================
// CAMERA SYSTEM
// ==============================

let cameraMode = "third";

const cameraTarget = new THREE.Vector3();

let mouseSensitivity = 0.002;

let mouseYaw = 0;
let mousePitch = 0;

let isMouseLocked = false;


// MOUSE LOCK

renderer.domElement.addEventListener("click", () => {

    if (!isMouseLocked) {
        renderer.domElement.requestPointerLock();
    }

});


// POINTER LOCK STATUS

document.addEventListener("pointerlockchange", () => {

    isMouseLocked =
        document.pointerLockElement === renderer.domElement;

    document.getElementById("status").textContent =
        isMouseLocked
            ? "WASD MOVE | DOUBLE-TAP W TO SPRINT | ESC UNLOCK"
            : "CLICK GAME TO LOCK MOUSE";

});


// MOUSE MOVEMENT

document.addEventListener("mousemove", (event) => {

    if (!isMouseLocked) return;

    mouseYaw -= event.movementX * mouseSensitivity;

    mousePitch -= event.movementY * mouseSensitivity;

    mousePitch = THREE.MathUtils.clamp(
        mousePitch,
        -0.65,
        0.75
    );

});


// CAMERA SWITCH

const cameraButton = document.getElementById("camera-switch");

cameraButton.addEventListener("click", () => {

    if (cameraMode === "third") {

        cameraMode = "first";
        cameraButton.textContent = "TPP";

    } else {

        cameraMode = "third";
        cameraButton.textContent = "FPP";

    }

});


// ==============================
// PLAYER MOVEMENT
// ==============================

const keys = {};

let lastWPress = 0;

let isSprinting = false;

window.addEventListener("keydown", (event) => {

    const key = event.key.toLowerCase();

    if (["w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
    }

    if (key === "w" && !keys["w"]) {

        const currentTime = Date.now();

        if (currentTime - lastWPress < 350) {
            isSprinting = true;
        }

        lastWPress = currentTime;

    }

    keys[key] = true;

});


window.addEventListener("keyup", (event) => {

    const key = event.key.toLowerCase();

    keys[key] = false;

    if (key === "w") {
        isSprinting = false;
    }

});


// ==============================
// PLAYER ANIMATION
// ==============================

let walkTime = 0;

let isMoving = false;

const playerLegs = [];

player.children.forEach(part => {

    if (
        part.geometry &&
        part.geometry.type === "CylinderGeometry" &&
        part.position.y < 1
    ) {

        playerLegs.push(part);

    }

});


// ==============================
// MOVE PLAYER
// ==============================

function movePlayer() {

    const speed = isSprinting ? 0.22 : 0.09;

    isMoving =
        keys["w"] ||
        keys["s"] ||
        keys["a"] ||
        keys["d"];

    if (isMoving) {
        walkTime += isSprinting ? 0.28 : 0.16;
    } else {
        walkTime = 0;
    }


    const forward = new THREE.Vector3(
        -Math.sin(mouseYaw),
        0,
        -Math.cos(mouseYaw)
    );

    const right = new THREE.Vector3(
        Math.cos(mouseYaw),
        0,
        -Math.sin(mouseYaw)
    );

    const moveDirection = new THREE.Vector3();

    if (keys["w"]) moveDirection.add(forward);
    if (keys["s"]) moveDirection.sub(forward);
    if (keys["d"]) moveDirection.add(right);
    if (keys["a"]) moveDirection.sub(right);

    if (moveDirection.lengthSq() > 0) {

        moveDirection.normalize();

        player.position.addScaledVector(
            moveDirection,
            speed
        );

    }

    if (isMoving) {
        player.rotation.y = mouseYaw;
    }


    const swing = isMoving
        ? Math.sin(walkTime) * 0.65
        : 0;

    playerLegs[0].rotation.x = swing;
    playerLegs[1].rotation.x = -swing;

    playerArms[0].rotation.x = -swing * 0.7;
    playerArms[1].rotation.x = swing * 0.7;


    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -4.5,
        4.5
    );

}


// ==============================
// ZOMBIE ANIMATION
// ==============================

let zombieWalkTime = 0;

function animateZombies() {

    zombieWalkTime += 0.045;

    zombies.forEach((zombie, index) => {

        const movement = zombieMovement[index];

        // RANDOM DIRECTION CHANGE
        movement.timer--;

        if (movement.timer <= 0) {

            movement.direction +=
                (Math.random() - 0.5) * Math.PI;

            movement.timer = 60 + Math.random() * 120;

        }

        // ACTUAL ZOMBIE MOVEMENT
        const moveX = Math.sin(movement.direction);
        const moveZ = Math.cos(movement.direction);

        zombie.position.x += moveX * movement.speed;
        zombie.position.z += moveZ * movement.speed;

        // KEEP ZOMBIES INSIDE CITY AREA
        if (zombie.position.x < -5 || zombie.position.x > 5) {
            movement.direction = -movement.direction;
        }

        if (zombie.position.z > -8 || zombie.position.z < -90) {
            movement.direction += Math.PI;
        }

        zombie.position.x = THREE.MathUtils.clamp(
            zombie.position.x, -5, 5
        );

        zombie.position.z = THREE.MathUtils.clamp(
            zombie.position.z, -90, -8
        );

        // FACE MOVEMENT DIRECTION
        zombie.rotation.y = Math.atan2(
            moveX,
            moveZ
        );

        // WALKING ANIMATION
        const phase = zombieWalkTime + movement.phase;
        const swing = Math.sin(phase) * 0.4;

        zombieArms[index][0].rotation.x = -0.35 + swing;
        zombieArms[index][1].rotation.x = -0.35 - swing;

        zombieLegs[index][0].rotation.x = swing * 0.7;
        zombieLegs[index][1].rotation.x = -swing * 0.7;

        zombie.position.y =
            Math.abs(Math.sin(phase * 2)) * 0.04;

    });

}

// ==============================
// CAMERA UPDATE
// ==============================

function updateCamera() {

    if (cameraMode === "third") {

        player.visible = true;

        const distance = 8;

        const horizontalDistance =
            distance * Math.cos(mousePitch);

        cameraTarget.set(
            player.position.x +
            Math.sin(mouseYaw) * horizontalDistance,

            player.position.y +
            1.5 +
            Math.sin(mousePitch) * distance,

            player.position.z +
            Math.cos(mouseYaw) * horizontalDistance
        );

        camera.position.lerp(
            cameraTarget,
            0.45
        );

        camera.lookAt(
            player.position.x,
            player.position.y + 1.5,
            player.position.z
        );

    } else {

        player.visible = false;

        camera.position.set(
            player.position.x,
            player.position.y + 2.2,
            player.position.z
        );

        const direction = new THREE.Vector3(
            -Math.sin(mouseYaw) * Math.cos(mousePitch),
            Math.sin(mousePitch),
            -Math.cos(mouseYaw) * Math.cos(mousePitch)
        );

        const lookTarget = camera.position
            .clone()
            .addScaledVector(direction, 10);

        camera.lookAt(lookTarget);

    }

}


// ==============================
// ANIMATION LOOP
// ==============================

function animate() {

    requestAnimationFrame(animate);

    movePlayer();

    animateZombies();

    updateCamera();

    renderer.render(scene, camera);

}

animate();


// ==============================
// WINDOW RESIZE
// ==============================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


// ==============================
// GAME STATUS
// ==============================

document.getElementById("status").textContent =
    "CLICK GAME TO START";

</script>

</body>
</html>
